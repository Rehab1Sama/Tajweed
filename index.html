<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f3b46">
<title>مختبر التجويد</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Amiri+Quran&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16323a;--ink2:#2a4d57;--muted:#5f7176;--line:#d9e2e1;--paper:#f3f6f5;--card:#fff;
  --glass:#e9f6fb;--glass2:#cfe9f3;--steel:#c9d3d6;--steel2:#9fb0b5;--wood:#d8b98f;--wood2:#b8915f;
  --ok:#2e8b57;--bad:#c4473d;--amber:#e3a33b;--amber2:#fcebc9;
  --f-d:'Readex Pro','IBM Plex Sans Arabic',system-ui,sans-serif;--f-b:'IBM Plex Sans Arabic',system-ui,'Segoe UI',sans-serif;--f-q:'Amiri Quran','Amiri',serif;
  --r:18px;--sh:0 8px 24px rgba(22,50,58,.08)
}
*{box-sizing:border-box}
html{font-size:16px}html.fs1{font-size:18px}html.fs2{font-size:20px}
body{margin:0;color:#1f2b2e;font-family:var(--f-b);line-height:1.8;-webkit-tap-highlight-color:transparent;
  background-color:#eef3f2;background-image:linear-gradient(rgba(255,255,255,.75) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.75) 2px,transparent 2px);background-size:46px 46px}
button{font-family:inherit}
svg.i{width:20px;height:20px;flex:none;vertical-align:middle}
.wrap{max-width:780px;margin:0 auto;padding:0 14px 90px}
/* ===== الشريط العلوي ===== */
.cl-bar{position:sticky;top:0;z-index:40;display:flex;gap:6px;align-items:center;padding:8px 12px;background:rgba(250,252,252,.93);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.cl-bar .brand{margin-inline-end:auto;font-family:var(--f-d);font-weight:700;color:var(--ink);font-size:.95rem;display:flex;align-items:center;gap:6px;cursor:pointer}
.cl-chip{border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:5px 11px;font-size:.8rem;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.cl-chip b{background:var(--amber);color:#fff;border-radius:999px;padding:0 7px;font-size:.72rem}
.cl-sync{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}.cl-sync.off{background:var(--amber)}
/* ===== لوحة المختبر (العنوان) ===== */
.plate{margin:16px 0 6px;position:relative;border-radius:16px;padding:16px 18px 14px;background:linear-gradient(180deg,#fdfefe,#e8eef0);border:1px solid #cfd9dc;box-shadow:0 2px 0 #fff inset,0 10px 24px rgba(22,50,58,.10)}
.plate::before,.plate::after{content:"";position:absolute;top:10px;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#9fb0b5);box-shadow:0 1px 1px rgba(0,0,0,.2)}
.plate::before{right:10px}.plate::after{left:10px}
.plate small{display:block;font-size:.72rem;letter-spacing:.06em;color:var(--steel2);font-family:var(--f-d)}
.plate h1{font-family:var(--f-d);margin:0;font-size:1.55rem;color:var(--ink);line-height:1.3}
.plate p{margin:2px 0 0;color:var(--muted);font-size:.88rem}
.tube{margin-top:12px;display:flex;align-items:center;gap:10px}
.tube .t{flex:1;height:16px;border-radius:16px;background:rgba(255,255,255,.8);border:2px solid #b7c8cd;position:relative;overflow:hidden}
.tube .t i{position:absolute;inset:0 auto 0 0;right:auto;background:linear-gradient(90deg,#7fd1b0,#3fae86);border-radius:16px;transition:width .8s}
.tube .t::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 9%,rgba(22,50,58,.18) 9% calc(9% + 1px))}
.tube span{font-size:.8rem;color:var(--ink2);font-weight:600;white-space:nowrap}
/* ===== الرفوف ===== */
.shelf-h{margin:20px 4px 2px;display:flex;align-items:center;gap:8px}
.shelf-h b{font-family:var(--f-d);color:var(--ink);font-size:1.05rem}
.shelf-h span{font-size:.75rem;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:999px;padding:0 10px}
.shelf{display:grid;grid-template-columns:repeat(3,1fr);margin-top:4px}
@media(min-width:600px){.shelf{grid-template-columns:repeat(4,1fr)}}
.ves{position:relative;border:0;background:none;cursor:pointer;padding:10px 4px 0;display:flex;flex-direction:column;align-items:center;text-align:center}
.ves::after{content:"";position:absolute;left:-1px;right:-1px;bottom:0;height:12px;background:linear-gradient(180deg,#e7cfa9,#c9a271 60%,#a9834f);box-shadow:0 6px 10px rgba(80,50,20,.18)}
.ves svg.v{width:78px;height:104px;display:block;filter:drop-shadow(0 4px 4px rgba(22,50,58,.10));transition:transform .2s}
.ves:active svg.v{transform:translateY(-3px) rotate(-3deg)}
.el{position:relative;z-index:1;margin:4px 0 16px;width:74px;border-radius:9px;background:#fff;border:1.5px solid var(--c);padding:3px 2px 2px;box-shadow:0 2px 0 rgba(0,0,0,.04)}
.el i{position:absolute;top:1px;right:5px;font-style:normal;font-size:.6rem;color:var(--muted)}
.el b{display:block;font-family:var(--f-d);font-size:1.05rem;color:var(--c);line-height:1.25}
.el em{display:block;font-style:normal;font-size:.6rem;line-height:1.35;color:var(--ink2);min-height:1.6em}
.ves .ok{position:absolute;top:6px;left:12px;z-index:2;background:var(--ok);color:#fff;border-radius:999px;font-size:.62rem;font-weight:700;padding:0 6px}
@keyframes bub{0%{transform:translateY(0);opacity:0}20%{opacity:.9}100%{transform:translateY(-38px);opacity:0}}
.bub{animation:bub 2.8s infinite ease-in}
.bub2{animation:bub 3.4s .9s infinite ease-in}
.legend2{display:flex;gap:12px;justify-content:center;margin:14px 0 0;font-size:.75rem;color:var(--muted);flex-wrap:wrap}
.legend2 span{display:inline-flex;align-items:center;gap:4px}.legend2 i{width:12px;height:12px;border-radius:3px;display:inline-block;border:1.5px solid #9fb0b5}
/* ===== رأس الدرس ===== */
.lh{margin:14px 0 8px;display:flex;align-items:center;gap:12px}
.back{border:1.5px solid var(--line);background:#fff;border-radius:12px;width:40px;height:40px;font-size:1.2rem;color:var(--ink);cursor:pointer;flex:none}
.lh .el{margin:0;width:58px;flex:none;padding:12px 2px 6px}.lh .el em{display:none}.lh .el b{font-size:1.3rem}
.lh h1{font-family:var(--f-d);font-size:1.25rem;margin:0;color:var(--ink);line-height:1.4}
.lh small{color:var(--muted);font-size:.78rem}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:6px 0 10px;position:sticky;top:46px;z-index:30;background:linear-gradient(#eef3f2 80%,rgba(238,243,242,0))}
.tabs.t3{grid-template-columns:repeat(3,1fr)}
.tab{border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:14px;padding:6px 2px;font-weight:600;font-size:.78rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.3}
.tab svg{width:22px;height:22px}
.tab[aria-selected="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tab[aria-selected="true"] svg *{stroke:#fff}
/* ===== دفتر المختبر ===== */
.note-pg{position:relative;background-color:#fffdf7;background-image:linear-gradient(rgba(64,140,170,.10) 1px,transparent 1px),linear-gradient(90deg,rgba(64,140,170,.10) 1px,transparent 1px);background-size:22px 22px;border-radius:6px 18px 18px 6px;box-shadow:var(--sh);padding:16px 16px 14px 18px;margin:12px 0;border-inline-end:5px solid var(--c,#7fd1b0)}
.note-pg h3{display:inline-block;font-family:var(--f-d);margin:0 0 8px;font-size:1rem;color:var(--ink);background:var(--c,#7fd1b0);background:color-mix(in srgb,var(--c,#7fd1b0) 22%,#fff);border-radius:8px;padding:2px 12px}
.note-pg p{margin:6px 0}
.ex{font-family:var(--f-q);font-size:1.18em;color:#0d4c5a;white-space:nowrap;padding:0 2px}
.exs{display:flex;flex-wrap:wrap;gap:6px}.exs .ex{background:var(--glass);border:1px solid var(--glass2);border-radius:10px;padding:1px 10px}
.lt{font-family:var(--f-q);font-size:1.15em;background:var(--amber2);border-radius:8px;padding:0 8px;color:#6d4307;white-space:nowrap}
.tag{background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.85rem}
.rule{border-radius:12px;padding:8px 12px;margin:8px 0;background:rgba(255,255,255,.85);border:1.5px solid color-mix(in srgb,var(--c,#7fd1b0) 45%,#fff)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.pair.three{grid-template-columns:1fr 1fr 1fr}
.pair>div{border-radius:12px;padding:10px;background:rgba(255,255,255,.9);border:1.5px solid var(--line)}
.pair>div:nth-child(1){border-top:5px solid #7fd1b0}.pair>div:nth-child(2){border-top:5px solid #e3a33b}.pair>div:nth-child(3){border-top:5px solid #a99be0}
.pair b{display:block;color:var(--ink);font-family:var(--f-d)}.pair span{font-size:.9rem}
@media(max-width:480px){.pair.three{grid-template-columns:1fr}}
.verse{font-family:var(--f-q);font-size:1.3rem;text-align:center;color:var(--ink);background:var(--glass);border-radius:12px;padding:8px}
.note{font-size:.84rem;color:#7a5a17;background:#fff6df;border-radius:10px;padding:6px 10px;border:1px dashed #e7c47d}
/* ===== منضدة التجربة ===== */
.tool{position:relative;background:#fff;border-radius:16px;box-shadow:var(--sh);padding:14px;margin:12px 0;border-top:6px solid #b9c6ca}
.tool::before{content:"";position:absolute;top:-6px;left:16px;right:16px;height:2px;background:rgba(255,255,255,.7)}
.tool h3{font-family:var(--f-d);margin:0 0 4px;color:var(--ink);font-size:1.02rem;display:flex;gap:8px;align-items:center}
.tool h3 svg{width:28px;height:28px;flex:none}
.tool .hint{color:var(--muted);font-size:.85rem;margin:0 0 10px}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.seg button{border:1.5px solid var(--line);background:#f8fbfb;border-radius:12px;padding:7px 12px;cursor:pointer;font-weight:600;color:var(--ink);font-size:.88rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.info{border-radius:14px;background:linear-gradient(180deg,var(--glass),#f5fbfd);border:1.5px solid var(--glass2);padding:12px;margin-top:10px;min-height:60px}
.info b{font-family:var(--f-d);color:var(--ink)}
.big{font-family:var(--f-q);font-size:2.2rem;text-align:center;color:var(--ink);line-height:1.6}
.btn{border:0;border-radius:14px;padding:10px 18px;font-weight:700;cursor:pointer;background:var(--ink);color:#fff;font-size:.95rem;display:inline-flex;align-items:center;gap:6px}
.btn.am{background:linear-gradient(180deg,#f0b955,#e09a2b);color:#3d2604;box-shadow:0 3px 0 #b97a1c}
.btn.gh{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn svg *{stroke:currentColor}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.fc{perspective:900px;height:150px;cursor:pointer;border:0;background:none;padding:0}
.fc .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fc.on .in{transform:rotateY(180deg)}
.fc .f,.fc .bk{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px}
.fc .f{background:#fff;border:1.5px solid var(--line);border-top:8px solid var(--c);font-family:var(--f-d);color:var(--ink);font-size:1.05rem;flex-direction:column;gap:4px}
.fc .f i{font-style:normal;font-size:.7rem;color:var(--muted)}
.fc .bk{background:var(--c);color:#14262b;transform:rotateY(180deg);font-size:.82rem;line-height:1.7}
.lg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;direction:rtl}
.lg button{aspect-ratio:1;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-family:var(--f-q);font-size:1.4rem;cursor:pointer;color:#203033;line-height:1}
.lg button.sel{outline:3px solid var(--amber);outline-offset:1px}
.k0{background:#dff3ea!important}.k1{background:#e4e8fb!important}.k2{background:#fbe7d3!important}.k3{background:#f6dbe5!important}.k4{background:#fff4c7!important}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;font-size:.78rem}.legend span{border-radius:999px;padding:1px 10px}
.beats{display:flex;gap:8px;justify-content:center;margin:14px 0;min-height:30px;flex-wrap:wrap}
.beats i{width:24px;height:24px;border-radius:50%;background:var(--line);transition:background .15s,transform .15s}
.beats i.on{background:var(--amber);transform:scale(1.15)}
.mk svg{width:100%;height:auto;display:block}
.mk .z{transition:opacity .2s}.mk .node{cursor:pointer}
.gauge{position:relative;height:30px;border-radius:30px;background:linear-gradient(90deg,#dbeffa,#eaf3f0 45%,#f7d9a6 80%,#e3a33b);margin:22px 4px 8px;border:2px solid #c3d0d4}
.gauge .needle{position:absolute;top:-10px;width:6px;height:50px;border-radius:4px;background:var(--ink);transition:right .5s;transform:translateX(50%)}
.gscale{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted)}
/* ===== عدسة المجهر ===== */
.lens-wrap{display:flex;flex-direction:column;align-items:center;margin:6px 0 2px}
.lens{position:relative;width:250px;height:250px;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;
  background:radial-gradient(circle,#ffffff 0 55%,#eef8fb 70%,#cfe3ea 100%);border:12px solid #2a4d57;box-shadow:0 0 0 4px #9fb0b5,inset 0 0 30px rgba(22,50,58,.25),0 12px 26px rgba(22,50,58,.2)}
.lens::before,.lens::after{content:"";position:absolute;background:rgba(42,77,87,.12)}
.lens::before{left:50%;top:12px;bottom:12px;width:1px}.lens::after{top:50%;left:12px;right:12px;height:1px}
.lens .g-p{position:relative;z-index:1;margin:0;font-size:1.75rem}
.lens-stand{width:70px;height:16px;border-radius:0 0 12px 12px;background:#2a4d57;margin-top:-4px}
/* ===== الأسئلة: قوارير ملوّنة ===== */
.g-card{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin:10px 0}
.g-count{font-size:.78rem;color:var(--muted);font-family:var(--f-d)}
.g-q{font-family:var(--f-d);font-size:1.06rem;color:var(--ink);margin:6px 0 10px}
.g-p{font-family:var(--f-q);font-size:1.6rem;text-align:center;margin:6px 0 12px;color:#123}
.g-p u{text-decoration:none;color:#c2453b;background:var(--amber2);border-radius:6px;padding:0 2px}
.g-opts{display:grid;gap:9px}
.g-opt{position:relative;display:flex;align-items:center;gap:10px;border:0;border-radius:16px;padding:11px 12px;text-align:start;cursor:pointer;font-size:.95rem;color:#1d2a2d;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 26%,#fff),#fff 85%);box-shadow:0 0 0 1.5px color-mix(in srgb,var(--c) 55%,#fff) inset;transition:transform .12s}
.g-opt:active{transform:scale(.98)}
.g-opt .vi{flex:none;width:30px;height:36px}
.g-opt.right{background:linear-gradient(90deg,#bfe8d1,#effaf3);box-shadow:0 0 0 2px var(--ok) inset}
.g-opt.wrong{background:linear-gradient(90deg,#f6c9c3,#fdf1ef);box-shadow:0 0 0 2px var(--bad) inset}
.g-fb{margin-top:8px;font-weight:600;min-height:1.5em}.g-fb.ok{color:var(--ok)}.g-fb.no{color:var(--bad)}
.g-go{margin-top:10px}
.g-big{font-family:var(--f-d);font-size:1.45rem;text-align:center;color:var(--ink);margin:6px 0}
.g-rule{text-align:center;color:var(--muted)}
.report{border:2px solid var(--line);border-radius:14px;padding:10px 12px;background:#fffdf7;margin-bottom:8px}
.report h3{margin:0;font-family:var(--f-d);color:var(--ink);font-size:1rem}
.stamp{width:118px;height:118px;margin:6px auto;border-radius:50%;display:grid;place-items:center;text-align:center;line-height:1.3;color:var(--ok);font-family:var(--f-d);font-weight:700;border:4px double var(--ok);transform:rotate(-10deg);background:rgba(46,139,87,.06)}
/* ===== الدخول والواجبات ===== */
.ov{position:fixed;inset:0;z-index:80;background:rgba(22,50,58,.5);display:flex;align-items:center;justify-content:center;padding:16px}
.ov[hidden]{display:none}
.login{background:#fff;border-radius:24px;padding:22px;width:100%;max-width:360px;text-align:center;border-top:8px solid #b9c6ca}
.login h2{font-family:var(--f-d);margin:6px 0;color:var(--ink)}
.login input{width:100%;font:inherit;padding:11px 14px;border:1.5px solid var(--line);border-radius:14px;margin:6px 0;text-align:center}
.login .err{color:var(--bad);min-height:1.4em;font-size:.88rem}
.hw{background:#eef3f2;border-radius:24px;width:100%;max-width:640px;max-height:92vh;overflow:auto;padding:14px}
.hw-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hw-top h2{font-family:var(--f-d);margin:0;color:var(--ink);font-size:1.15rem}
.hw-back{border:0;background:#fff;border-radius:12px;padding:6px 12px;cursor:pointer;color:var(--ink);font-weight:600}
.hw-item{display:block;width:100%;text-align:start;border:0;background:#fff;border-radius:16px;box-shadow:var(--sh);padding:12px 14px;margin:8px 0;cursor:pointer;border-inline-end:5px solid #b9c6ca}
.hw-item b{display:block;font-family:var(--f-d);color:var(--ink)}.hw-item small{display:block;color:var(--muted)}
.hw-st{display:inline-block;margin-top:4px;font-size:.78rem;font-weight:700;border-radius:999px;padding:1px 10px;background:var(--amber2);color:#8a5a0e}
.hw-st.done{background:#dff3ea;color:var(--ok)}.hw-st.late{background:#fbe5e2;color:var(--bad)}
.hw-empty{text-align:center;color:var(--muted);padding:20px}
.footer{text-align:center;color:var(--muted);font-size:.76rem;margin-top:26px}
.games-link{display:flex;align-items:center;gap:12px;margin:14px 0 6px;padding:14px;border-radius:20px;text-decoration:none;color:#e8f3f5;background:radial-gradient(120% 100% at 80% 0%,#23596a 0%,#0f3b46 55%,#0a2830 100%);box-shadow:0 14px 30px rgba(10,40,48,.28)}
.games-link .gl-i{flex:none;width:48px;height:48px;border-radius:14px;background:linear-gradient(180deg,#f0b550,#e3a33b);color:#3a2a07;display:grid;place-items:center}
.games-link .gl-i svg{width:26px;height:26px}
.games-link .gl-t{flex:1;display:flex;flex-direction:column;line-height:1.5}
.games-link .gl-t b{font-size:1.05rem;color:#fff}
.games-link .gl-t span{font-size:.8rem;color:#b9d3d9}
.games-link .gl-a{font-size:1.2rem;color:#ffd88c}
.games-mini{display:inline-flex;align-items:center;gap:6px;margin:4px 0 10px;padding:5px 14px;border-radius:999px;background:#fcebc9;color:#805716;font-weight:700;font-size:.85rem;text-decoration:none;border:1px solid #f0d39a}
.games-mini svg{width:16px;height:16px}
.locked{display:flex;align-items:center;gap:12px;width:100%;margin-top:8px;padding:16px 14px;border:2px dashed #b9c6ca;border-radius:20px;background:repeating-linear-gradient(135deg,#f3f6f5 0 12px,#eaf0ef 12px 24px);color:var(--ink);text-align:start;font:inherit;cursor:pointer}
.locked .lk-i{flex:none;width:46px;height:46px;border-radius:14px;background:#5f7176;color:#fff;display:grid;place-items:center}
.locked .lk-i svg{width:24px;height:24px}
.locked .lk-t{display:flex;flex-direction:column;line-height:1.55}
.locked .lk-t b{font-family:var(--f-d)}.locked .lk-t span{font-size:.8rem;color:var(--muted)}
.locked.nudge .lk-i{animation:lkn .4s}
@keyframes lkn{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.hw-kind{display:inline-block;margin-inline-start:8px;background:#16323a;color:#ffd88c;border-radius:999px;padding:0 10px;font-size:.72rem;vertical-align:middle}
.hw-item.exam{border-color:#e6c27a}
.hw-timer{float:left;font-weight:700;color:#a53630;font-family:var(--f-d)}

{id:'mabadi',lvl:1,title:'التجويد ومبادئه',sub:'تعريفه، وحكمه، ومبادئه العشرة',tool:'principles',

  {h:'تعريف التجويد',b:'<p><b>لغةً:</b> التحسين، يقال: جوَّدتُ الشيء أي حسَّنتُه.</p><p><b>اصطلاحًا:</b> إخراجُ كلِّ حرف من مخرجه، مع إعطائه حقَّه ومستحقَّه من الصفات.</p><div class="pair"><div><b>حقُّ الحرف</b><span>صفاته اللازمة التي لا تفارقه، كالجهر والهمس والشدة والاستعلاء.</span></div><div><b>مستحقُّه</b><span>صفاته العارضة التي تأتيه في بعض الأحوال، كالتفخيم والترقيق والإظهار والإدغام والمد.</span></div></div>'},

{id:'maratib',lvl:1,title:'مراتب القراءة واللحون',sub:'التحقيق والتدوير والحدر، واللحن الجلي والخفي',tool:'speed',

  {h:'اللحن',b:'<p><b>لغةً:</b> الميل عن الصواب. <b>اصطلاحًا:</b> الخطأ في القراءة، وهو نوعان:</p><div class="pair"><div><b>اللحن الجلي</b><span>خطأ ظاهر يطرأ على الألفاظ، كتغيير حرف بحرف أو حركة بحركة، سواء غيَّر المعنى أم لا. يعرفه القرَّاء وعامة الناس.<br><b>حكمه:</b> حرام بالإجماع.</span></div><div><b>اللحن الخفي</b><span>خطأ يخلُّ بعرف القراءة ولا يغيِّر المعنى، كترك الغنة أو تقصير المد أو تفخيم المرقَّق. يعرفه أهل هذا العلم.<br><b>حكمه:</b> حرام على الراجح.</span></div></div><p class="note">⚑ من العلماء من جعل اللحن الخفي مكروهًا.</p><p>مثال الجلي: قراءة <span class="ex">﴿أَنْعَمْتَ﴾</span> بضم التاء. ومثال الخفي: ترك الغنة في <span class="ex">﴿إِنَّ﴾</span>.</p>'}

{id:'noon',lvl:1,title:'أحكام النون الساكنة والتنوين',sub:'الإظهار، والإدغام، والإقلاب، والإخفاء',tool:'sorter',sorter:'noon',
 sec:[
  {h:'تعريفهما',b:'<div class="pair"><div><b>النون الساكنة</b><span>نون خالية من الحركة، ثابتة في اللفظ والخط وصلًا ووقفًا، وتكون في الأسماء والأفعال والحروف، في وسط الكلمة وآخرها: <span class="ex">مِنْ، يَنْهَوْنَ</span></span></div><div><b>التنوين</b><span>نون ساكنة زائدة تلحق آخر الاسم لفظًا ووصلًا، وتفارقه خطًّا ووقفًا: <span class="ex">عَلِيمٌ، عَلِيمًا، عَلِيمٍ</span></span></div></div><p>ولهما أربعة أحكام بحسب الحرف الذي يأتي بعدهما.</p>'},
  {h:'١. الإظهار الحلقي',b:'<p><b>حروفه ستة</b> (حروف الحلق): <span class="lt">ء هـ ع ح غ خ</span></p><p><b>كيفيته:</b> إخراج النون من مخرجها من غير زيادة في الغنة. <b>سببه:</b> بُعد مخرج النون عن مخرج حروف الحلق.</p><p class="exs"><span class="ex">مَنْ آمَنَ</span><span class="ex">مِنْ هَادٍ</span><span class="ex">مِنْ عِلْمٍ</span><span class="ex">عَلِيمٌ حَكِيمٌ</span><span class="ex">مِنْ غِلٍّ</span><span class="ex">مِنْ خَوْفٍ</span></p>'},
  {h:'٢. الإدغام',b:'<p><b>حروفه ستة</b> مجموعة في كلمة <span class="lt">يَرْمَلُونَ</span>، وهو قسمان:</p><div class="rule"><b>إدغام بغنة</b> في أربعة أحرف «يَنْمُو»: <span class="ex">مَنْ يَقُولُ</span> <span class="ex">مِنْ نِعْمَةٍ</span> <span class="ex">مِنْ مَالٍ</span> <span class="ex">مِنْ وَالٍ</span><br>وهو <b>ناقص</b> في الياء والواو لبقاء الغنة، و<b>كامل</b> في النون والميم.</div><div class="rule"><b>إدغام بغير غنة</b> في حرفين: اللام والراء: <span class="ex">مِنْ لَدُنْهُ</span> <span class="ex">مِنْ رَبِّهِمْ</span></div><div class="rule"><b>شرطه:</b> أن يكون من كلمتين. فإن اجتمعت النون وحرف «ينمو» في كلمة واحدة وجب الإظهار، ويسمى <b>الإظهار المطلق</b>، وورد في أربع كلمات: <span class="ex">الدُّنْيَا</span> <span class="ex">بُنْيَانٌ</span> <span class="ex">قِنْوَانٌ</span> <span class="ex">صِنْوَانٌ</span></div><p class="note">ولحفص: الإظهار في <span class="ex">يسٓ ۚ وَالْقُرْآنِ</span> و<span class="ex">نٓ ۚ وَالْقَلَمِ</span>، والسكت في <span class="ex">مَنْ ۜ رَاقٍ</span>.</p>'},
  {h:'٣. الإقلاب',b:'<p><b>حرفه واحد:</b> <span class="lt">ب</span></p><p><b>كيفيته:</b> قلب النون الساكنة أو التنوين ميمًا مخفاة بغنة. وعلامته في المصحف ميم صغيرة.</p><p class="exs"><span class="ex">مِنْ بَعْدِ</span><span class="ex">أَنْبِئْهُمْ</span><span class="ex">سَمِيعٌ بَصِيرٌ</span></p>'},
  {h:'٤. الإخفاء الحقيقي',b:'<p><b>حروفه خمسة عشر</b>، وهي الباقية، مجموعة في أوائل كلمات هذا البيت:</p><p class="verse">صِفْ ذَا ثَنَا كَمْ جَادَ شَخْصٌ قَدْ سَمَا ۞ دُمْ طَيِّبًا زِدْ فِي تُقًى ضَعْ ظَالِمَا</p><p><b>كيفيته:</b> النطق بالنون بصفة بين الإظهار والإدغام، خالية من التشديد، مع بقاء الغنة.</p><p class="exs"><span class="ex">أَنْتُمْ</span><span class="ex">مِنْ قَبْلِ</span><span class="ex">يَنْظُرُونَ</span><span class="ex">رِيحًا صَرْصَرًا</span></p>'},
  {h:'الغنة ومراتبها',b:'<p><b>الغنة:</b> صوت يخرج من الخيشوم، ومقدارها <b>حركتان</b>، وهي في مراتبها:</p><div class="rule"><b>أكمل ما تكون:</b> في المشدَّد والمدغم</div><div class="rule"><b>كاملة:</b> في المُخفى (إخفاء النون والميم، والإقلاب)</div><div class="rule"><b>ناقصة:</b> في الساكن المُظهَر</div><div class="rule"><b>أنقص ما تكون:</b> في النون والميم المتحركتين</div>'}

{id:'meem',lvl:1,title:'أحكام الميم الساكنة',sub:'الإخفاء الشفوي، والإدغام الشفوي، والإظهار الشفوي',tool:'sorter',sorter:'meem',
 sec:[
  {h:'الميم الساكنة',b:'<p>هي الميم الخالية من الحركة، الثابتة وصلًا ووقفًا. ولها ثلاثة أحكام بحسب الحرف الذي بعدها.</p>'},
  {h:'١. الإخفاء الشفوي',b:'<p><b>حرفه:</b> <span class="lt">ب</span></p><p>إخفاء الميم عند الباء مع الغنة، وسُمِّي شفويًّا لخروج الميم والباء من الشفتين.</p><p class="exs"><span class="ex">تَرْمِيهِمْ بِحِجَارَةٍ</span><span class="ex">وَهُمْ بِالْآخِرَةِ</span></p><p class="note">⚑ اختلف أهل الأداء في كيفية الشفتين عنده: بفرجة خفيفة، أو بإطباقهما. والفرجة هي المختارة عند كثير من المعاصرين.</p>'},
  {h:'٢. الإدغام الشفوي',b:'<p><b>حرفه:</b> <span class="lt">م</span></p><p>ميم ساكنة بعدها ميم متحركة، فتُدغم الأولى في الثانية مع الغنة، ويسمى أيضًا <b>إدغام المثلين الصغير</b>.</p><p class="exs"><span class="ex">لَهُمْ مَا يَشَاءُونَ</span><span class="ex">كَمْ مِنْ فِئَةٍ</span></p>'},
  {h:'٣. الإظهار الشفوي',b:'<p><b>حروفه:</b> الستة والعشرون الباقية.</p><p>إظهار الميم من غير زيادة في الغنة.</p><p class="exs"><span class="ex">أَنْعَمْتَ عَلَيْهِمْ غَيْرِ</span><span class="ex">هُمْ فِيهَا</span><span class="ex">عَلَيْهِمْ وَلَا</span></p><div class="rule"><b>تنبيه:</b> يشتد الإظهار عند <b>الواو والفاء</b>، فاحذري إخفاء الميم عندهما؛ لاتحاد مخرجها مع الواو وقربه من الفاء.</div>'}
 ],

{id:'madd',lvl:1,title:'المدود',sub:'المد الأصلي وما يلحق به، والمدود الفرعية',tool:'beat',
 sec:[
  {h:'تعريف المد',b:'<p><b>لغةً:</b> الزيادة. <b>اصطلاحًا:</b> إطالة الصوت بحرف من حروف المد.</p><p><b>حروف المد ثلاثة:</b> الألف الساكنة المفتوح ما قبلها، والواو الساكنة المضموم ما قبلها، والياء الساكنة المكسور ما قبلها، وقد اجتمعت في <span class="ex">نُوحِيهَا</span>.</p><p><b>حرفا اللين:</b> الواو والياء الساكنتان المفتوح ما قبلهما: <span class="ex">خَوْفٍ، بَيْتٍ</span></p><p><b>الحركة:</b> مقدار قبض الإصبع أو بسطه بحالة متوسطة.</p>'},
  {h:'المد الأصلي (الطبيعي)',b:'<p>هو الذي لا تقوم ذات الحرف إلا به، ولا يتوقف على سبب من همز أو سكون. <b>مقداره حركتان.</b></p><p class="exs"><span class="ex">قَالَ</span><span class="ex">يَقُولُ</span><span class="ex">قِيلَ</span></p><p><b>ويلحق به (حركتان):</b></p><div class="rule"><b>مد العوض:</b> الوقف على تنوين النصب ألفًا: <span class="ex">عَلِيمًا ← عَلِيمَا</span></div><div class="rule"><b>مد الصلة الصغرى:</b> هاء الضمير بين متحركين وليس بعدها همز: <span class="ex">إِنَّهُۥ كَانَ</span></div><div class="rule"><b>مد البدل:</b> همز بعده حرف مد: <span class="ex">آمَنُوا، إِيمَانًا، أُوتُوا</span></div><div class="rule"><b>الحروف الخمسة في فواتح السور</b> «حي طهر»: <span class="ex">طه، يس، حم</span></div>'},
  {h:'المد الفرعي بسبب الهمز',b:'<div class="rule"><b>المتصل الواجب:</b> حرف المد وبعده همز في كلمة واحدة. <b>٤ أو ٥ حركات</b>، و<b>٦</b> إن وُقف على همز متطرف.<br><span class="ex">جَاءَ</span> <span class="ex">السُّوءِ</span> <span class="ex">سِيئَتْ</span> <span class="ex">السَّمَاءُ</span></div><div class="rule"><b>المنفصل الجائز:</b> حرف المد آخر كلمة والهمز أول الكلمة التي بعدها. <b>٤ أو ٥ حركات.</b><br><span class="ex">يَا أَيُّهَا</span> <span class="ex">قُوا أَنْفُسَكُمْ</span> <span class="ex">فِي أَنْفُسِكُمْ</span></div><div class="rule"><b>مد الصلة الكبرى:</b> هاء الضمير بين متحركين وبعدها همز. حكمه حكم المنفصل: <span class="ex">مَالَهُۥ أَخْلَدَهُ</span></div><p class="note">⚑ هذا من طريق الشاطبية. ولحفص من طريق الطيبة قصر المنفصل حركتين.</p>'},
  {h:'المد الفرعي بسبب السكون',b:'<div class="rule"><b>العارض للسكون:</b> حرف مد بعده حرف سكن للوقف. <b>٢ أو ٤ أو ٦ حركات.</b> <span class="ex">نَسْتَعِينْ</span> <span class="ex">الرَّحِيمْ</span></div><div class="rule"><b>مد اللين:</b> حرف لين بعده حرف سكن للوقف. <b>٢ أو ٤ أو ٦ حركات.</b> <span class="ex">خَوْفْ</span> <span class="ex">الْبَيْتْ</span></div><div class="rule"><b>اللازم:</b> حرف مد بعده سكون أصلي ثابت وصلًا ووقفًا. <b>٦ حركات</b>، وأقسامه أربعة:<br>كلمي مثقل: <span class="ex">الضَّالِّينَ</span> · كلمي مخفف: <span class="ex">آلْآنَ</span> (موضعا يونس)<br>حرفي مثقل: <span class="ex">الٓمٓ</span> (لام ميم) · حرفي مخفف: <span class="ex">قٓ</span> <span class="ex">صٓ</span></div><p class="note">والعين في فاتحتي مريم والشورى: <b>٤ أو ٦</b> حركات.</p>'},
  {h:'ترتيب المدود قوةً',b:'<p class="verse">لازم ← متصل ← عارض ← منفصل ← بدل</p><p>إذا اجتمع سببان عُمل بالأقوى.</p>'}
 ],

 sec:[
  {h:'تعريف المخرج',b:'<p>المخرج: محل خروج الحرف الذي يتميز به عن غيره.</p><div class="rule"><b>طريقة معرفة مخرج الحرف:</b> سكِّنيه أو شدِّديه، وأدخلي عليه همزة مفتوحة، ثم أصغي إليه، فحيث انقطع الصوت فهو مخرجه: <span class="ex">أَبْ، أَتْ، أَقْ</span></div>'},
  {h:'المخارج العامة والخاصة',b:'<p>المخارج <b>العامة خمسة:</b> الجوف، والحلق، واللسان، والشفتان، والخيشوم.</p><p>والمخارج <b>الخاصة سبعة عشر</b> على المختار (مذهب الخليل وابن الجزري):</p><div class="rule"><b>الجوف (١):</b> حروف المد الثلاثة.</div><div class="rule"><b>الحلق (٣):</b> أقصاه: ء هـ · وسطه: ع ح · أدناه: غ خ</div><div class="rule"><b>اللسان (١٠):</b> وفيه أكثر الحروف، وتجدين تفصيلها في <b>التجربة</b>.</div><div class="rule"><b>الشفتان (٢):</b> باطن الشفة السفلى مع أطراف الثنايا العليا: ف · وبين الشفتين: ب م و</div><div class="rule"><b>الخيشوم (١):</b> مخرج الغنة.</div>'},
  {h:'ألقاب الحروف',b:'<p>سُمِّيت الحروف بأسماء مواضعها:</p><p class="exs"><span class="tag">حلقية: ء هـ ع ح غ خ</span><span class="tag">لهوية: ق ك</span><span class="tag">شجرية: ج ش ي</span><span class="tag">حافية: ض</span><span class="tag">ذلقية: ل ن ر</span><span class="tag">نطعية: ط د ت</span><span class="tag">أسلية: ص ز س</span><span class="tag">لثوية: ظ ذ ث</span><span class="tag">شفوية: ف ب م و</span><span class="tag">جوفية: حروف المد</span></p>'}

{id:'sifat',lvl:2,title:'صفات الحروف',sub:'الصفات المتضادة والصفات التي لا ضد لها',tool:'sifat',

  {h:'تعريف الصفة وفائدتها',b:'<p>الصفة: كيفية تَعرِض للحرف عند خروجه من مخرجه.</p><p><b>فائدتها:</b> تمييز الحروف التي تشترك في المخرج (كالطاء والتاء)، ومعرفة القوي من الضعيف.</p>'},
  {h:'الصفات المتضادة',b:'<div class="pair"><div><b>الهمس</b><span>جريان النفس عند النطق بالحرف. حروفه عشرة: <span class="lt">فَحَثَّهُ شَخْصٌ سَكَتْ</span></span></div><div><b>الجهر</b><span>انحباس النفس. حروفه الباقية.</span></div></div><div class="pair three"><div><b>الشدة</b><span>انحباس الصوت: <span class="lt">أَجِدْ قَطٍ بَكَتْ</span></span></div><div><b>التوسط</b><span>بين الشدة والرخاوة: <span class="lt">لِنْ عُمَرْ</span></span></div><div><b>الرخاوة</b><span>جريان الصوت: الحروف الباقية.</span></div></div><div class="pair"><div><b>الاستعلاء</b><span>ارتفاع اللسان إلى الحنك الأعلى: <span class="lt">خُصَّ ضَغْطٍ قِظْ</span></span></div><div><b>الاستفال</b><span>انخفاض اللسان: الحروف الباقية.</span></div></div><div class="pair"><div><b>الإطباق</b><span>انطباق اللسان على الحنك الأعلى: <span class="lt">ص ض ط ظ</span></span></div><div><b>الانفتاح</b><span>عدم الانطباق: الحروف الباقية.</span></div></div><div class="pair"><div><b>الإذلاق</b><span>خفة الحرف وخروجه من طرف اللسان أو الشفة: <span class="lt">فِرَّ مِنْ لُبٍّ</span></span></div><div><b>الإصمات</b><span>ثقل الحرف: الحروف الباقية.</span></div></div>'},

{id:'alaqat',lvl:2,title:'علاقات الحروف',sub:'المتماثلان والمتجانسان والمتقاربان والمتباعدان',tool:'relations',
 sec:[
  {h:'أنواع العلاقات',b:'<p>إذا التقى حرفان في الخط واللفظ، فعلاقتهما واحدة من أربع:</p><div class="rule"><b>المتماثلان:</b> اتفقا مخرجًا وصفة، كالباءين والدالين.</div><div class="rule"><b>المتجانسان:</b> اتفقا مخرجًا واختلفا صفة، كالتاء والطاء.</div><div class="rule"><b>المتقاربان:</b> تقاربا مخرجًا أو صفة، كاللام والراء.</div><div class="rule"><b>المتباعدان:</b> تباعدا مخرجًا واختلفا صفة، كالنون والعين.</div>'},
  {h:'الصغير والكبير والمطلق',b:'<div class="rule"><b>الصغير:</b> الأول ساكن والثاني متحرك.</div><div class="rule"><b>الكبير:</b> الحرفان متحركان.</div><div class="rule"><b>المطلق:</b> الأول متحرك والثاني ساكن.</div>'},
  {h:'الأحكام لحفص',b:'<div class="rule"><b>المتماثلان الصغير:</b> يجب الإدغام: <span class="ex">اضْرِبْ بِعَصَاكَ</span> <span class="ex">يُدْرِكْكُمْ</span> <span class="ex">قَدْ دَخَلُوا</span><br>إلا إذا كان الأول حرف مد فيُظهر: <span class="ex">قَالُوا وَهُمْ</span> <span class="ex">فِي يَوْمٍ</span></div><div class="rule"><b>المتجانسان الصغير:</b> يُدغم في هذه المواضع، ويُظهر في غيرها:<br>الدال في التاء: <span class="ex">قَدْ تَبَيَّنَ</span> · التاء في الدال: <span class="ex">أَثْقَلَتْ دَعَوَا</span><br>التاء في الطاء: <span class="ex">قَالَتْ طَائِفَةٌ</span> · الطاء في التاء (إدغام ناقص): <span class="ex">بَسَطْتَ</span> <span class="ex">أَحَطْتُ</span><br>الثاء في الذال: <span class="ex">يَلْهَثْ ذَلِكَ</span> · الذال في الظاء: <span class="ex">إِذْ ظَلَمُوا</span><br>الباء في الميم: <span class="ex">ارْكَبْ مَعَنَا</span></div><div class="rule"><b>المتقاربان الصغير:</b> يُدغم في: اللام في الراء: <span class="ex">قُلْ رَبِّ</span> <span class="ex">بَلْ رَفَعَهُ</span>، والقاف في الكاف: <span class="ex">أَلَمْ نَخْلُقْكُمْ</span>، والنون الساكنة في «يرملون». ويُظهر في غيرها. ويُستثنى السكت في <span class="ex">بَلْ ۜ رَانَ</span></div><div class="rule"><b>الكبير والمطلق والمتباعدان:</b> الإظهار، إلا كلمات مخصوصة كـ<span class="ex">تَأْمَنَّا</span> بالإدغام مع الإشمام أو الروم.</div><p class="note">⚑ في «نخلقكم» الإدغام الكامل هو المقدَّم، ويُروى الناقص.</p>'}
 ],

{id:'wasl',lvl:2,title:'همزة الوصل',sub:'مواضعها، وبأي حركة يُبدأ بها',tool:'wasl',
 sec:[
  {h:'تعريفها',b:'<p><b>همزة الوصل:</b> همزة زائدة في أول الكلمة، يُتوصَّل بها إلى النطق بالساكن. <b>تثبت في الابتداء وتسقط في الوصل.</b></p><p><b>همزة القطع:</b> تثبت في الحالين: <span class="ex">أَنْعَمْتَ، إِيَّاكَ</span></p>'},
  {h:'في الأسماء: يُبدأ بها مكسورة',b:'<div class="rule"><b>أسماء محفوظة،</b> الوارد منها في القرآن سبعة: <span class="ex">ابْن، ابْنَت، امْرُؤ، امْرَأَة، اثْنَيْنِ، اثْنَتَيْنِ، اسْم</span></div><div class="rule"><b>مصادر الأفعال الخماسية والسداسية:</b> <span class="ex">انْتِقَام، اسْتِغْفَار</span></div>'},
  {h:'في الأفعال',b:'<p>تكون في: الماضي الخماسي والسداسي وأمرهما، وأمر الثلاثي: <span class="ex">انْطَلَقَ، اسْتَغْفَرَ، انْطَلِقُوا، اذْهَبْ</span></p><div class="rule"><b>يُبدأ بها مضمومة:</b> إذا كان ثالث الفعل مضمومًا ضمًّا لازمًا: <span class="ex">اُنْظُرْ، اُدْعُ، اُخْرُجْ</span></div><div class="rule"><b>يُبدأ بها مكسورة:</b> إذا كان ثالثه مفتوحًا أو مكسورًا: <span class="ex">اِذْهَبْ، اِضْرِبْ، اِسْتَغْفَرَ</span><br>أو مضمومًا ضمًّا عارضًا: <span class="ex">اِمْشُوا، اِقْضُوا، اِئْتُوا، اِبْنُوا</span></div>'},
  {h:'في الحروف: يُبدأ بها مفتوحة',b:'<p>في «ال» التعريف فقط: <span class="ex">اَلْحَمْدُ، اَلْقَمَرُ، اَلشَّمْسُ</span></p>'},
  {h:'مع همزة الاستفهام',b:'<div class="rule">إذا دخلت همزة الاستفهام على همزة وصل <b>مكسورة</b> حُذفت همزة الوصل: <span class="ex">أَصْطَفَى، أَتَّخَذْتُمْ</span></div><div class="rule">وإذا دخلت على همزة «ال» لم تُحذف، بل تُبدل ألفًا مع المد اللازم ست حركات، أو تُسهَّل: <span class="ex">آلذَّكَرَيْنِ، آللَّهُ، آلْآنَ</span></div>'}
 ],

{id:'tafkheem',lvl:2,title:'التفخيم والترقيق',sub:'حروف الاستعلاء ومراتبها، والألف واللام والراء',tool:'gauge',
 sec:[
  {h:'التعريف',b:'<div class="pair"><div><b>التفخيم</b><span>سِمَن يدخل على صوت الحرف فيمتلئ الفم بصداه.</span></div><div><b>الترقيق</b><span>نُحول يدخل على صوت الحرف فلا يمتلئ الفم بصداه.</span></div></div>'},
  {h:'حروف مفخَّمة دائمًا',b:'<p>حروف الاستعلاء: <span class="lt">خُصَّ ضَغْطٍ قِظْ</span>، وأقواها حروف الإطباق. ومراتب تفخيمها خمس:</p><div class="rule">١. المفتوح بعده ألف: <span class="ex">طَائِعِينَ</span></div><div class="rule">٢. المفتوح بلا ألف: <span class="ex">صَبَرُوا</span></div><div class="rule">٣. المضموم: <span class="ex">قُتِلَ</span></div><div class="rule">٤. الساكن: <span class="ex">اقْرَأْ</span></div><div class="rule">٥. المكسور: <span class="ex">خِيفَةً</span></div><p class="note">⚑ من العلماء من جعلها ثلاث مراتب، ومنهم من جعل الساكن تابعًا لحركة ما قبله.</p>'},
  {h:'حروف مرقَّقة دائمًا',b:'<p>حروف الاستفال كلها، ما عدا اللام في لفظ الجلالة والراء والألف. فاحذري تفخيم الهمزة والهاء والميم مثلًا في: <span class="ex">الْحَمْدُ لِلَّهِ</span></p>'},
  {h:'حروف تُفخَّم تارة وتُرقَّق تارة',b:'<div class="rule"><b>الألف:</b> تتبع ما قبلها: مفخمة في <span class="ex">قَالَ</span>، مرققة في <span class="ex">كَانَ</span></div><div class="rule"><b>لام لفظ الجلالة:</b> تُفخَّم بعد فتح أو ضم: <span class="ex">قَالَ اللَّهُ</span> <span class="ex">رُسُلُ اللَّهِ</span>، وتُرقَّق بعد كسر: <span class="ex">بِسْمِ اللَّهِ</span> <span class="ex">لِلَّهِ</span></div><div class="rule"><b>الراء تُفخَّم:</b> إذا كانت مفتوحة أو مضمومة: <span class="ex">رَبِّ</span> <span class="ex">رُزِقُوا</span><br>أو ساكنة بعد فتح أو ضم: <span class="ex">مَرْيَمَ</span> <span class="ex">الْقُرْآنُ</span><br>أو ساكنة بعد كسر عارض: <span class="ex">ارْجِعُوا</span><br>أو ساكنة بعد كسر أصلي وبعدها حرف استعلاء غير مكسور في كلمتها: <span class="ex">قِرْطَاسٍ</span> <span class="ex">مِرْصَادًا</span> <span class="ex">فِرْقَةٍ</span><br>أو موقوفًا عليها بعد ساكن غير الياء قبله فتح أو ضم: <span class="ex">الْعَصْرْ</span> <span class="ex">الْقَدْرْ</span></div><div class="rule"><b>الراء تُرقَّق:</b> إذا كانت مكسورة: <span class="ex">رِجَالٌ</span><br>أو ساكنة بعد كسر أصلي وليس بعدها حرف استعلاء: <span class="ex">فِرْعَوْنَ</span> <span class="ex">مِرْيَةٍ</span><br>أو موقوفًا عليها بعد ياء ساكنة: <span class="ex">خَبِيرْ</span> <span class="ex">خَيْرْ</span>، أو بعد كسر: <span class="ex">مُنْتَصِرْ</span>، أو بعد ساكن قبله كسر: <span class="ex">الذِّكْرْ</span></div><div class="rule"><b>يجوز فيها الوجهان:</b> <span class="ex">فِرْقٍ</span> (الشعراء)، و<span class="ex">مِصْرَ</span> و<span class="ex">الْقِطْرِ</span> وقفًا، والمختار أن يُوقف عليهما كحال الوصل: تفخيم مصر، وترقيق القطر.</div>'}
 ],

  var mode='in',F=function(id){return document.getElementById(id);};
  function setMode(m){mode=m;[].forEach.call(F('clTabs').children,function(b){b.classList.toggle('on',b.getAttribute('data-m')===m);});
    var up=m==='up';['clPin2','clCircle','clCode'].forEach(function(id){F(id).hidden=!up;F(id).required=up&&id!=='clCircle';});
    F('clName').placeholder=up?'اسمكِ الثلاثي':'اسمكِ';F('clPin').placeholder=up?'اختاري رمزًا من ٤ أرقام أو أكثر':'الرمز';
    F('clHint').textContent=up?'أنشئي حسابكِ بنفسكِ، واحفظي اسمكِ ورمزكِ لتدخلي بهما كل مرة. رمز الانضمام تجدينه عند معلمتكِ.':'المختبر خاص بطالبات مقرأة سنا الآي. ادخلي باسمكِ ورمزكِ.';
    go.textContent=up?'أنشئي حسابي ‹':'ادخلي ‹';err.textContent='';}
  [].forEach.call(F('clTabs').children,function(b){b.addEventListener('click',function(){setMode(b.getAttribute('data-m'));});});
  function done(r){tok=r.token;me=r.name;ls('lab-token',tok);ls('lab-name',me);ls(SK,'{}');

  var ERR={CODE:'رمز الانضمام غير صحيح، اطلبيه من معلمتكِ',DUP:'هذا الاسم مسجَّل من قبل. إن كان حسابكِ فادخلي من «لديَّ حساب»، وإلا فأضيفي اسم العائلة',PIN:'الرمز يكون من ٤ إلى ٨ أرقام',NAME:'اكتبي اسمكِ الثلاثي',CLOSED:'التسجيل مغلق الآن، تواصلي مع معلمتكِ'};
  form.addEventListener('submit',function(e){
    e.preventDefault();err.textContent='';
    var up=mode==='up',name=F('clName').value.trim(),pin=F('clPin').value.trim();
    if(up){if(!/^[0-9\u0660-\u0669]{4,8}$/.test(pin)){err.textContent=ERR.PIN;return;}if(pin!==F('clPin2').value.trim()){err.textContent='الرمزان غير متطابقين';return;}}
    pin=pin.replace(/[\u0660-\u0669]/g,function(d){return String(d.charCodeAt(0)-0x660);});
    go.disabled=true;var lbl=go.textContent;go.textContent='لحظة…';
    var call=up?rpc('student_register',{p_name:name,p_pin:pin,p_circle:F('clCircle').value,p_code:F('clCode').value}):rpc('student_login',{p_name:name,p_pin:pin});
    call.then(function(r){if(!r.ok){err.textContent=up?(ERR[r.error]||'تعذَّر إنشاء الحساب'):'الاسم أو الرمز غير صحيح';return;}done(r);})
    .catch(function(x){err.textContent=/LOCKED/.test(x.message)?'محاولات كثيرة، انتظري ربع ساعة ثم حاولي':'تعذَّر الاتصال، تأكدي من الإنترنت';})
    .then(function(){go.disabled=false;go.textContent=lbl;});
  });
  rpc('public_settings',{}).then(function(st){if(st&&st.join_open===false){F('clTabs').hidden=true;}}).catch(function(){});
  /* ===== طابور الإرسال (يعمل بلا إنترنت) ===== */
  function queue(){try{return JSON.parse(ls('lab-queue')||'[]');}catch(e){return [];}}
  function setQ(q){ls('lab-queue',JSON.stringify(q.slice(-500)));}
  function push(op){var q=queue();q.push(op);setQ(q);setMe();flush();}
  var flushing=false;
  function flush(){
    if(flushing||!tok)return;var q=queue();if(!q.length)return;flushing=true;
    var ans=q.filter(function(o){return o.t==='a';}).slice(0,150);
    var p=ans.length?rpc('save_answers',{p_token:tok,p_items:ans.map(function(o){return o.d;})}):Promise.resolve();
    p.then(function(){
      var ids=ans.map(function(a){return a.id;});var rest=queue().filter(function(o){return ids.indexOf(o.id)<0;});setQ(rest);
      var g=rest.filter(function(o){return o.t!=='a';})[0];
      if(g)return (g.t==='g'?rpc('save_gate',{p_token:tok,p_station:g.d.s,p_score:g.d.r,p_total:g.d.n}):rpc('submit_assignment',{p_token:tok,p_assignment:g.d.id,p_score:g.d.r,p_total:g.d.n,p_details:g.d.det||[]}))
        .then(function(){setQ(queue().filter(function(o){return o.id!==g.id;}));});
    }).then(function(){flushing=false;setMe();if(queue().length)setTimeout(flush,800);})
    .catch(function(x){flushing=false;setMe();if(/SESSION/.test(x.message)){alert('انتهت جلستكِ، سجِّلي الدخول مرة أخرى');logout();}});
  }
  setInterval(flush,15000);window.addEventListener('online',flush);
  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
  window.__labListen=function(station,word){if(!tok){showLogin();err.textContent='سجِّلي الدخول ليُحسب استماعكِ للدرس';return Promise.reject(new Error('LOGIN'));}return rpc('mark_listened',{p_token:tok,p_station:station,p_word:word||null});};
  window.__labLog=function(d){if(!tok)return;push({t:'a',id:uid(),d:d});};
  window.__labGate=function(s,r,n){if(!tok)return;push({t:'g',id:uid(),d:{s:s,r:r,n:n}});};
  /* ===== المزامنة ===== */
  var state=null;
  function sync(){
    if(!tok)return;
    rpc('student_state',{p_token:tok}).then(function(st){
      state=st;ls('lab-listened',JSON.stringify(st.listened||[]));ls('lab-wordfor',JSON.stringify(st.word_for||[]));if(st.level2_open!=null)ls('lab-lv2',st.level2_open?'1':'0');var stamps={};(st.progress||[]).forEach(function(p){if(p.stamped)stamps[p.station]=true;});
      var loc={};try{loc=JSON.parse(ls(SK)||'{}');}catch(e){}
      Object.keys(loc).forEach(function(k){if(loc[k])stamps[k]=true;});
      ls(SK,JSON.stringify(stamps));
      if(!/^#[a-z]+\/(quiz|micro|lab)/.test(location.hash)&&window.__labRefresh)window.__labRefresh();
      updHw();
    }).catch(function(x){if(/SESSION/.test(x.message))logout();});
  }
  /* ===== الواجبات ===== */
  var hwOv=document.getElementById('hwOv'),hwWrap=document.getElementById('hwWrap');
  function pending(){return ((state&&state.assignments)||[]).filter(function(a){return a.score==null;});}
  function updHw(){var n=pending().length;hwB.innerHTML='<svg class="i" viewBox="0 0 24 24" style="width:16px;height:16px"><rect x="5" y="4" width="14" height="17" rx="2" fill="none" stroke="#16323a" stroke-width="1.8"/><path d="M9 4V2.8h6V4M8.5 13l2.2 2.2 4.8-4.7" fill="none" stroke="#16323a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>واجباتي'+(n?' <b>'+ar(n)+'</b>':'');}
  function closeHw(){hwOv.hidden=true;document.body.style.overflow='';}
  hwOv.addEventListener('click',function(e){if(e.target===hwOv)closeHw();});
  hwB.addEventListener('click',function(){if(!tok){showLogin();return;}hwOv.hidden=false;document.body.style.overflow='hidden';listHw();sync();});
  function fmtDate(d){try{return ar(new Date(d).toLocaleDateString('ar',{weekday:'long',day:'numeric',month:'long'}));}catch(e){return '';}}
  function qw(n){return n===1?'سؤال واحد':n===2?'سؤالان':(n>=3&&n<=10)?ar(n)+' أسئلة':ar(n)+' سؤالًا';}
  function top(title,back){hwWrap.innerHTML='';var t=E('div','hw-top');t.appendChild(E('h2',null,title));var b=E('button','hw-back',back?'‹ رجوع':'إغلاق ✕');b.type='button';b.addEventListener('click',back||closeHw);t.appendChild(b);hwWrap.appendChild(t);}
  function listHw(){
    top('واجباتي');
    var A=(state&&state.assignments)||[];
    if(!A.length){hwWrap.appendChild(E('p','hw-empty','لا توجد واجبات الآن 🌸'));return;}
    A.forEach(function(a){
      var ex=a.kind==='exam';var b=E('button','hw-item'+(ex?' exam':''));b.type='button';var tt=E('b',null,a.title);if(ex){var bd=E('span','hw-kind','اختبار');tt.appendChild(bd);}b.appendChild(tt);
      if(a.note)b.appendChild(E('small',null,a.note));
      var n=(a.custom||[]).length+(a.stations&&a.stations.length?a.qcount:0);
      b.appendChild(E('small',null,qw(n)+(ex&&a.minutes?' · '+ar(a.minutes)+' دقيقة':'')+(ex?' · محاولة واحدة':'')+(a.due_at?' · آخر موعد: '+fmtDate(a.due_at):'')));
      var late=a.due_at&&new Date(a.due_at)<new Date()&&a.score==null;
      b.appendChild(E('span','hw-st'+(a.score!=null?' done':late?' late':''),a.score!=null?('✓ أنجزتِه: '+ar(a.score)+' من '+ar(a.total)):late?'متأخر':'لم يُنجز بعد'));
      b.addEventListener('click',function(){runHw(a);});hwWrap.appendChild(b);
    });
  }
  function shuf(x){x=x.slice();for(var i=x.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=x[i];x[i]=x[j];x[j]=t;}return x;}
  function runHw(a){
    var EX=a.kind==='exam';
    if(EX&&a.score!=null){top(a.title,listHw);var c0=E('div','g-card');c0.appendChild(E('p','g-big','سلَّمتِ هذا الاختبار'));c0.appendChild(E('p','g-rule','نتيجتكِ: '+ar(a.score)+' من '+ar(a.total)+'. الاختبار محاولة واحدة فقط.'));hwWrap.appendChild(c0);return;}
    if(EX&&!confirm('هذا اختبار بمحاولة واحدة'+(a.minutes?' ومدته '+ar(a.minutes)+' دقيقة':'')+'. لا تخرجي حتى تُنهيه. هل أنتِ مستعدة؟'))return;
    var items=[],timer=null,endAt=a.minutes?Date.now()+a.minutes*60000:0,finished=false;
    (a.custom||[]).forEach(function(c,i){var o=shuf(c.o.map(function(t,k){return {t:t,r:k===c.a};}));items.push({q:c.q,o:o.map(function(x){return x.t;}),a:o.map(function(x){return x.r;}).indexOf(true),k:'custom'});});
    if(a.stations&&a.stations.length&&window.__bankItems)window.__bankItems(a.stations,a.qcount).forEach(function(it){items.push(it);});
    items=shuf(items);var i=0,right=0,det=[];

      var c=E('div','g-card');

      var it=items[i];c.appendChild(E('p','g-q',it.q));
      var opts=E('div','g-opts'),fb=E('div','g-fb'),done=false;
      it.o.forEach(function(t,k){var b=E('button','g-opt',t);b.type='button';b.addEventListener('click',function(){
        if(done)return;done=true;var ok=k===it.a;if(ok)right++;
        det.push({q:it.q,ok:ok});window.__labLog({source:'homework',station:it.k==='custom'?null:it.k,question:it.q,correct:ok,assignment_id:a.id});
        if(EX){b.classList.add('picked');i++;if(i<items.length)setTimeout(q,250);else setTimeout(end,250);return;}
        b.classList.add(ok?'right':'wrong');opts.children[it.a].classList.add('right');
        fb.className='g-fb '+(ok?'ok':'no');fb.textContent=ok?'أحسنتِ!':'الصحيح باللون الأخضر';
        var nx=E('button','btn g-go',i<items.length-1?'التالي ‹':'إنهاء الواجب');nx.type='button';nx.addEventListener('click',function(){i++;if(i<items.length)q();else end();});c.appendChild(nx);
      });opts.appendChild(b);});
      c.appendChild(opts);c.appendChild(fb);hwWrap.appendChild(c);
    }
    function end(){
      if(finished)return;finished=true;clearInterval(timer);
      push({t:'s',id:uid(),d:{id:a.id,r:right,n:items.length,det:det}});
      a.score=Math.max(a.score||0,right);a.total=items.length;updHw();
      top(a.title,listHw);var c=E('div','g-card');
      c.appendChild(E('p','g-big','أصبتِ '+ar(right)+' من '+ar(items.length)));
      c.appendChild(E('p','g-rule',EX?'تم تسليم الاختبار، ووصلت نتيجتكِ إلى معلمتكِ 🌸':right/items.length>=.8?'ما شاء الله، أحسنتِ! وصلت نتيجتكِ إلى معلمتكِ 🌸':'وصلت نتيجتكِ إلى معلمتكِ. راجعي الدرس وأعيدي الواجب إن أحببتِ، وتُحسب أعلى نتيجة.'));
      var b=E('button','btn g-go','العودة إلى الواجبات');b.type='button';b.addEventListener('click',listHw);c.appendChild(b);hwWrap.appendChild(c);
    }
    if(!items.length){top(a.title,listHw);hwWrap.appendChild(E('p','hw-empty','لا أسئلة في هذا الواجب'));return;}
    q();
  }
  /* ===== إعدادات المعلمة (فتح المستوى الثاني) ===== */
  rpc('public_settings',{}).then(function(st){var v=st&&st.level2_open?'1':'0';if(ls('lab-lv2')!==v){ls('lab-lv2',v);if(window.__labRefresh&&!/^#[a-z]+\/(quiz|micro|lab)/.test(location.hash))window.__labRefresh();}}).catch(function(){});

      var t=E('div','ios-tip');
      t.innerHTML=ios?'<b>لتثبيت التطبيق على الآيفون:</b><br>١. افتحي الموقع من متصفح سفاري.<br>٢. اضغطي زرَّ المشاركة (المربع الذي فيه سهم للأعلى) أسفل الشاشة.<br>٣. اختاري «إضافة إلى الشاشة الرئيسية».'
        :'<b>تطبيق مختبر التجويد للأندرويد</b><br>١. اضغطي «تحميل التطبيق» بالأسفل.<br>٢. افتحي الملف بعد تحميله واضغطي «تثبيت».<br><small>إن طلب الجوال السماح بتثبيت التطبيقات من هذا المصدر، فاسمحي له ثم ارجعي.</small><br><a class="apk-btn" href="https://github.com/Rehab1Sama/Tajweed/releases/latest/download/tajweed-lab.apk">تحميل التطبيق</a>';
      var x=E('button',null,'حسنًا');x.onclick=function(){t.remove();};t.appendChild(x);document.body.appendChild(t);
    });
    window.addEventListener('appinstalled',function(){inst.hidden=true;});
  }
  if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(function(){});
})();

</script>
